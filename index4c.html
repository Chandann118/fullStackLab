<!DOCTYPE html>
<html>
<head>
 <title>Combinator Selectors</title>
 <style>
 div p { color: green; }
 div > p { font-weight: bold; }
 h1 + p { color: red; }
 h1 ~ p { font-style: italic; }
 </style>
</head>
<body>
 <h1>Combinator Selectors Example</h1>
 <p>This paragraph is adjacent sibling of h1.</p>
 <p>This paragraph is general sibling of h1.</p>
 <div>
 <p>This is a child paragraph of div.</p>
 <section>
 <p>This is a descendant (not direct child) of div.</p>
 </section>
 </div>
</body>
</html>
