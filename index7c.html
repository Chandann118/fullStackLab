<!DOCTYPE html>
<html>
<head>
<title>Array Object Example</title>
<script>
function arrayDemo() {
 var fruits = ["Apple", "Banana", "Mango"];
 fruits.push("Orange");
 document.write("Fruits: " + fruits.join(", ") + "<br>");
 document.write("Total Fruits: " + fruits.length);
}
</script>
</head>
<body onload="arrayDemo()">
</body>
</html>
