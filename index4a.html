<!DOCTYPE html>
<html>
<head>
 <title>Selector Types</title>
 <style>
 h2 { color: green; }
 #unique { color: red; font-weight: bold; }
 .highlight { background-color: yellow; font-style: italic; }
 h3, p { text-align: center; color: blue; }
 * { font-family: Arial, sans-serif; }
 </style>
</head>
<body>
 <h2>Element Selector Example</h2>
 <p id="unique">This is styled with an ID selector.</p>
 <p class="highlight">This is styled with a class selector.</p>
 <h3>Grouped Selector Example</h3>
 <p>Grouped styling applied here.</p>
</body>
</html>
