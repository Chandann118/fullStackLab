<!DOCTYPE html>
<html>
<head>
 <title>Lists Example</title>
</head>
<body>
 <h2>Ordered List</h2>
 <ol>
 <li>Apple</li>
 <li>Banana</li>
 <li>Orange</li>
 </ol>
 <h2>Unordered List</h2>
 <ul>
 <li>Pen</li>
 <li>Pencil</li>
 <li>Eraser</li>
 </ul>
 <h2>Nested List</h2>
 <ul>
 <li>Fruits
 <ol>
 <li>Apple</li>
 <li>Banana</li>
 </ol>
 </li>
 <li>Vegetables
 <ol>
 <li>Tomato</li>
 <li>Potato</li>
 </ol>
 </li>
 </ul>
 <h2>Definition List</h2>
 <dl>
 <dt>HTML</dt>
 <dd>Hyper Text Markup Language</dd>
 <dt>CSS</dt>
 <dd>Cascading Style Sheets</dd>
 </dl>
</body>
</html>
