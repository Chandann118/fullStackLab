<!DOCTYPE html>
<html>
<head>
 <title>CSS Example</title>
 <style>
 p { color: blue; font-size: 18px; } /* internal CSS */
 </style>
 <link rel="stylesheet" href="styles.css"> <!-- external CSS -->
</head>
<body>
 <h2 style="color:red;">This is a heading (inline CSS)</h2>
 <p>This paragraph uses internal CSS.</p>
 <p class="external">This text uses external CSS.</p>
</body>
</html>
