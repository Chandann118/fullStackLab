<!DOCTYPE html>
<html>
<head>
 <title>Simple Selectors</title>
 <style>
 h1 { color: darkblue; }
 #main { color: green; }
 .special { color: orange; }
 h2, p { font-size: 18px; }
 * { background-color: #f0f0f0; }
 </style>
</head>
<body>
 <h1>Element Selector Example</h1>
 <p id="main">This paragraph uses ID selector.</p>
 <p class="special">This text uses class selector.</p>
 <h2>Grouped Selector</h2>
 <p>Another grouped selector example.</p>
</body>
</html>
